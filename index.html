<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinelScan on Monad</title>
    <meta name="description" content="Wallet and transaction risk signals for Monad Testnet, with a public on-chain signal registry." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SentinelScan on Monad" />
    <meta property="og:description" content="Check a Monad address before you trust it: risk signals with reasons and evidence, a public on-chain registry, an on-chain payment guard, a live radar and an AI agent. Monad Testnet only." />
    <meta name="theme-color" content="#6d4ae8" />
    <script>
      // Set the theme before first paint so the page never flashes the wrong colours.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
